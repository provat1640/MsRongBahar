services:
  # ==========================================
  # 1. NestJS Core API Microservice
  # ==========================================
  - type: web
    name: ms-rong-bahar-api
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/backend
    buildCommand: npm ci --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: ms-rong-bahar-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ms-rong-bahar-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://msrongbahar.me

  # ==========================================
  # 2. Next.js Storefront Frontend
  # ==========================================
  - type: web
    name: ms-rong-bahar-storefront
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/frontend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://ms-rong-bahar-api.onrender.com/api

databases:
  # ==========================================
  # PostgreSQL 16 ACID Database
  # ==========================================
  - name: ms-rong-bahar-db
    plan: free
    region: singapore
    databaseName: rongbahardb
    user: rongbaharuser

# Redis In-Memory Cache & Lock Store
# Note: On Render free tier, if internal redis is used
