name: Shutdown & Decommission Pipeline (Website Offline)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. VERIFY OFFLINE FRONTEND SHUTDOWN PAGE
  # =========================================================================
  qa-check:
    name: 🧪 Verify Offline Shutdown Storefront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/frontend/package.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./apps/frontend
        run: npm ci --legacy-peer-deps

      - name: 🌐 Build Offline Storefront
        working-directory: ./apps/frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # =========================================================================
  # 2. DEPLOY OFFLINE SHUTDOWN NOTICE TO VERCEL (TERMINATE TRAFFIC)
  # =========================================================================
  deploy-vercel:
    name: 🔺 Deploy Decommissioned Notice to Vercel
    needs: [qa-check]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Offline Page to Vercel Production
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/frontend
          vercel-args: '--prod'

  # =========================================================================
  # 3. DISABLED SERVICES (Render, Fly.io, GHCR, Supabase Migrations)
  # =========================================================================
  # All backend deployment, Docker registry pushing, and database migrations
  # are intentionally disabled as the services have been decommissioned.
