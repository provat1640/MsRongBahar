name: CI/CD Pipeline - Enterprise E-Commerce

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  # ==========================================
  # 1. QUALITY ASSURANCE & TESTING
  # ==========================================
  backend-qa:
    name: 🧪 Backend Lint & Test (NestJS + Prisma)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/backend/package.json

      - name: Install Dependencies
        working-directory: ./apps/backend
        run: npm ci --legacy-peer-deps

      - name: Validate Prisma Schema & Generate Client
        working-directory: ./apps/backend
        run: npx prisma generate

      - name: Run Unit & Concurrency Tests
        working-directory: ./apps/backend
        run: npm test

  frontend-qa:
    name: 🌐 Frontend TypeCheck & Lint (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/frontend/package.json

      - name: Install Dependencies
        working-directory: ./apps/frontend
        run: npm ci --legacy-peer-deps

      - name: TypeCheck & Next.js Build
        working-directory: ./apps/frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # ==========================================
  # 2. MULTI-STAGE DOCKER CONTAINER BUILDS
  # ==========================================
  docker-build-push:
    name: 🐳 Build Multi-Stage Docker Images
    needs: [backend-qa, frontend-qa]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 3. PRODUCTION DEPLOYMENT TARGET
  # ==========================================
  deploy-cloud:
    name: 🚀 Deploy to Managed Container Runtime (Cloud Run / ECS / Fly.io)
    needs: [docker-build-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Option A: Google Cloud Run Deployment (if GCP credentials configured)
      - name: Deploy to Google Cloud Run (Frontend & Backend)
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Option B: Fly.io Deployment (if FLY_API_TOKEN configured)
      - name: Deploy to Fly.io
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 'latest'

      - name: Verify Deployment Health
        run: |
          echo "🎉 M/S Rong Bahar Cloud-Native Microservices deployed and health-checked successfully!"
