version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rong_bahar_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rongbaharsecretpass}
      POSTGRES_DB: ${POSTGRES_DB:-ms_rong_bahar_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: rong_bahar_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-rongredispass} --appendonly yes
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1G

  backend:
    image: ${DOCKER_REGISTRY:-ghcr.io/yourorg}/rong-bahar-backend:${IMAGE_TAG:-latest}
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: rong_bahar_backend_prod
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      - postgres
      - redis

  frontend:
    image: ${DOCKER_REGISTRY:-ghcr.io/yourorg}/rong-bahar-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: rong_bahar_frontend_prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend

volumes:
  postgres_prod_data:
  redis_prod_data:
