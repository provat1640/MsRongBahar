version: '3.8'

services:
  # 1. Primary Relational Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: rong_bahar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ms_rong_bahar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ms_rong_bahar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. In-Memory Session & Cache Layer (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: rong_bahar_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Backend API Service (NestJS)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: rong_bahar_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/ms_rong_bahar_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "rong-bahar-super-secret-production-jwt-key-2026"
      FRONTEND_URL: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Next.js Storefront & PDPs (Frontend)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: rong_bahar_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
