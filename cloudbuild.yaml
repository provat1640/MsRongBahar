# ==========================================
# Google Cloud Build & Cloud Run Pipeline
# ==========================================
steps:
  # 1. Build Backend Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ms-rong-bahar-backend:$SHORT_SHA', '-t', 'gcr.io/$PROJECT_ID/ms-rong-bahar-backend:latest', '-f', 'apps/backend/Dockerfile', './apps/backend']

  # 2. Build Frontend Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ms-rong-bahar-frontend:$SHORT_SHA', '-t', 'gcr.io/$PROJECT_ID/ms-rong-bahar-frontend:latest', '-f', 'apps/frontend/Dockerfile', './apps/frontend']

  # 3. Push Images to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ms-rong-bahar-backend:$SHORT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ms-rong-bahar-frontend:$SHORT_SHA']

  # 4. Deploy Backend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ms-rong-bahar-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ms-rong-bahar-backend:$SHORT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '4000'

  # 5. Deploy Frontend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ms-rong-bahar-storefront'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ms-rong-bahar-frontend:$SHORT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'

images:
  - 'gcr.io/$PROJECT_ID/ms-rong-bahar-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/ms-rong-bahar-backend:latest'
  - 'gcr.io/$PROJECT_ID/ms-rong-bahar-frontend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/ms-rong-bahar-frontend:latest'
